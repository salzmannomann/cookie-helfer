    <button id="didomi-notice-agree-button">Cookies akzeptieren</button>

  </div>
</div>
<script>
// wie willhaben: nach „Ablehnen“ bleibt berechtigtes Interesse an, bis man es über die Didomi-Schnittstelle abstellt
window.Didomi = {
  getCurrentUserStatus: () => ({ purposes: { werbung: { enabled: false } } }),
  setUserStatusForAll: (o) => {
    window.geklickt.push('didomi-api');
    if (!o.purposesLIStatus) tcfSetzen({ bi: [] });
  },
};
document.getElementById('didomi-notice-disagree-button').addEventListener('click', () => {
  window.geklickt.push('d-nein');
  document.getElementById('didomi-notice').remove();
  setTimeout(() => tcfSetzen({ bi: [2, 7, 8, 9, 10, 11] }), 200);
});
merken(document.getElementById('didomi-notice-agree-button'), 'd-ja', '#didomi-notice');
</script>
