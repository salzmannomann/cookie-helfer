<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Cookie-Helfer</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { width: 300px; padding: 14px 16px; }
    .host { color: var(--muted); font-size: 12px; word-break: break-all; }
    .status { margin: 10px 0 8px; }
    .status b { font-size: 16px; }
    .status .host { display: block; }
    .karte { margin: 0 0 8px; padding: 9px 12px; background: var(--card); border-radius: 8px; font-size: 12.5px; }
    .karte h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 4px; }
    .karte ul { list-style: none; padding: 0; }
    .karte li.ok { color: var(--ok); }
    .karte li.warn { color: var(--warn); }
    details { margin: 6px 0 0; font-size: 12.5px; }
    summary { cursor: pointer; color: var(--muted); padding: 3px 0; }
    details ul { color: var(--muted); padding-left: 16px; margin-top: 2px; }
    .footer { margin-top: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1 class="brand"><img src="icons/icon.svg" alt="" width="24" height="24">Cookie-Helfer</h1>
  <label class="switch">Cookie-Helfer aktiv <input type="checkbox" id="aktiv"></label>
  <label class="switch"><span>Auf dieser Seite<br><span class="host" id="seite">–</span></span> <input type="checkbox" id="seiteAn"></label>

  <div id="status" class="status"><b>…</b></div>

  <div class="karte" id="tcf" hidden>
    <h2>Kontrolle (TCF)</h2>
    <ul id="tcfListe"></ul>
  </div>

  <details>
    <summary>Ablauf auf dieser Seite</summary>
    <ul id="ereignisse"></ul>
  </details>
  <details>
    <summary>Frühere Besuche</summary>
    <ul id="protokoll"></ul>
  </details>

  <div class="footer">
    <a href="#" id="vorgaben">Vorgaben</a>
    <span class="hint" id="version"></span>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
